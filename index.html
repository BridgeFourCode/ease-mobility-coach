<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ease Mobility Coach</title><style>body{font-family:system-ui;margin:0;background:#eef6f0;color:#234634}main{max-width:650px;margin:auto;padding:30px}article{background:white;border-radius:20px;padding:25px}button{background:#287856;color:white;border:0;border-radius:12px;padding:13px;margin:5px;font-size:16px}h1{font-size:36px}#timer{font-size:64px;font-weight:800}</style><main><h1>Ease 🌿</h1><p>Gentle hip and pelvic mobility · Knee-friendly, no Malasana</p><article><p id="count"></p><h2 id="name"></h2><p id="desc"></p><div id="timer"></div><p id="cue"></p><button id="start">Start</button><button id="skip">Next</button><button id="test">Test voice</button></article></main><script>const steps=[['Diaphragmatic breathing',120,'Relax your belly and hips. Inhale gently for four seconds, exhale for six.'],['Ankle rotations',60,'Circle ankles in both directions.'],['Bent knee hip twists',60,'Move bent knees gently side to side.'],['Butterfly',90,'Soles together, knees supported.'],['Pelvic tilts',60,'Tilt pelvis gently, no strong hip thrust.'],['Knees to chest',60,'Gently draw both knees to your chest.'],['Hamstring stretch and ankle pumps',120,'Gently stretch one leg and pump ankle. Change sides halfway.'],['Single knee to chest',120,'Bring one knee to chest. Change sides halfway.'],['Reclined twist left',60,'Gently rotate bent knee left.'],['Reclined twist right',60,'Gently rotate bent knee right.'],['Happy Baby',60,'Support legs and relax hips.'],['Reclined figure four',120,'Cross ankle above opposite knee, and switch sides halfway.'],['Supported 90/90',120,'Support your knees and skip if uncomfortable. Change sides halfway.'],['Supported Fish Pose',60,'Support back and head.'],['Child pose variation',90,'Use a cushion and avoid kneeling if your knees hurt.'],['Seated scalp massage',120,'Sit comfortably and massage scalp.'],['Reclined Butterfly',150,'Support knees with cushions, breathe slowly.']];let i=0,left=steps[0][1],running=false,t=null;const el=id=>document.getElementById(id),fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');function voice(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=.9;speechSynthesis.speak(u)}}function draw(){el('count').textContent='Exercise '+(i+1)+' / '+steps.length;el('name').textContent=steps[i][0];el('desc').textContent=steps[i][2];el('timer').textContent=fmt(left);el('start').textContent=running?'Pause':'Start / Resume'}function next(){i++;if(i>=steps.length){clearInterval(t);running=false;i=steps.length-1;left=0;voice('Session complete, well done!');draw();return}left=steps[i][1];voice(steps[i][0]+'. '+steps[i][2]);draw()}el('start').onclick=()=>{if(running){clearInterval(t);running=false;draw();return}running=true;voice(steps[i][0]+'. '+steps[i][2]);t=setInterval(()=>{left--;if(left<=0){next()}else{draw()}},1000);draw()};el('skip').onclick=next;el('test').onclick=()=>voice('Welcome to Ease, your guided mobility coach.');draw();</script></html>
